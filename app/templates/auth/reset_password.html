{% extends "auth/base_auth.html" %}
{% block title %}Nova senha{% endblock %}
{% block content %}
  <div class="auth-symbol"><i data-lucide="shield-check"></i></div>
  <div class="auth-heading"><h2>Defina uma nova senha</h2><p>Escolha uma senha segura que você ainda não tenha usado.</p></div>
  <form method="post" class="form-stack" data-loading-form data-password-form>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}">
    <div class="field"><label for="password">Nova senha</label><div class="input-with-icon"><i data-lucide="lock-keyhole"></i><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" placeholder="Mínimo de 8 caracteres" data-password-strength required><button type="button" class="password-toggle" data-password-toggle aria-label="Mostrar senha"><i data-lucide="eye"></i></button></div><div class="password-meter"><span></span><span></span><span></span><span></span></div></div>
    <div class="field"><label for="confirm_password">Confirme a senha</label><div class="input-with-icon"><i data-lucide="lock-keyhole"></i><input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" placeholder="Repita a nova senha" required></div><small class="field-error" data-password-match></small></div>
    <button class="button button-primary button-block" type="submit"><span>Salvar nova senha</span><i data-lucide="check"></i></button>
  </form>
{% endblock %}
